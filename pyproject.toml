[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlo-research"
version = "0.1.0"
description = "Stage 1 experimental foundation for Quantum Langevin Optimization / barren-plateau research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pennylane==0.45.1",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
